services:
  # FastAPI Backend
  - type: web
    name: naval-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: naval-ai-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: naval-ai-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: 1440
      - key: YOLO_WEIGHTS_PATH
        value: ./models/weights/best.pt
      - key: YOLO_DEVICE
        value: cpu
      - key: YOLO_CONF_THRESHOLD
        value: "0.35"
      - key: YOLO_IOU_THRESHOLD
        value: "0.45"
      - key: TRACKER_TYPE
        value: bytetrack
      - key: MAX_VIDEO_DURATION_SECONDS
        value: "300"
      - key: ALLOWED_ORIGINS
        value: https://frontend-delta-five-46.vercel.app
      - key: UPLOAD_DIR
        value: ./uploads
      - key: OUTPUT_DIR
        value: ./outputs
      - key: REPORT_DIR
        value: ./reports

  # Background video processing worker
  - type: worker
    name: naval-ai-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./
    dockerCommand: python worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: naval-ai-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: naval-ai-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: naval-ai-backend
          envVarKey: JWT_SECRET_KEY
      - key: YOLO_WEIGHTS_PATH
        value: ./models/weights/best.pt
      - key: YOLO_DEVICE
        value: cpu
      - key: UPLOAD_DIR
        value: ./uploads
      - key: OUTPUT_DIR
        value: ./outputs
      - key: REPORT_DIR
        value: ./reports

  # Redis (for async video job queue)
  - type: redis
    name: naval-ai-redis
    plan: free

databases:
  # PostgreSQL
  - name: naval-ai-postgres
    plan: free
    databaseName: naval_ai
    user: naval_user
